name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: docker.io/jgripe455679

jobs:
  backend:
    name: Build and Test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout backend source code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew clean test

  worker:
    name: Build and Test (worker)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: Checkout worker source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall messaging
      - run: python -m compileall utils
      - run: python -m py_compile messaging/*.py
      - run: python -m py_compile utils/*.py

  admin-ui:
    name: Build and Test (admin-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout admin-ui source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build

  user-ui:
    name: Build and Test (user-ui)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user

    steps:
      - name: Checkout user-ui source code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, worker, admin-ui, user-ui]
    env:
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      worker-digest: ${{ steps.worker.outputs.digest }}
      admin-digest: ${{ steps.admin_ui.outputs.digest }}
      user-digest: ${{ steps.user_ui.outputs.digest }}

    steps:
      - name: Check frontend API URL
        run: test -n "$VITE_API_BASE_URL" || { echo "::error::VITE_API_BASE_URL is not set"; exit 1; }

      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push (backend)
        id: backend
        run: |
          docker buildx build \
          --push \
          --tag "${IMAGE_PREFIX}/health-watch-api:${GITHUB_SHA}" \
          --metadata-file backend-metadata.json \
          ./backend

          digest=$(jq -r '."containerimage.digest"' backend-metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Build and Push (worker)
        id: worker
        run: |
          docker buildx build \
          --push \
          --tag "${IMAGE_PREFIX}/health-watch-worker:${GITHUB_SHA}" \
          --metadata-file worker-metadata.json \
          ./scripts

          digest=$(jq -r '."containerimage.digest"' worker-metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Build and Push (admin-ui)
        id: admin_ui
        run: |
          docker buildx build \
          --push \
          --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL" \
          --tag "${IMAGE_PREFIX}/health-watch-admin-ui:${GITHUB_SHA}" \
          --metadata-file admin-ui-metadata.json \
          ./frontend

          digest=$(jq -r '."containerimage.digest"' admin-ui-metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Build and Push (user-ui)
        id: user_ui
        run: |
          docker buildx build \
          --push \
          --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL" \
          --tag "${IMAGE_PREFIX}/health-watch-user-ui:${GITHUB_SHA}" \
          --metadata-file user-ui-metadata.json \
          ./frontend-user

          digest=$(jq -r '."containerimage.digest"' user-ui-metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # ============================================================
      # Trivy - Backend - SARIF
      # ============================================================

      - name: Scan Image (backend) - SARIF
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-api@${{ steps.backend.outputs.digest }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report (backend) - SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

      # ============================================================
      # Trivy - Backend - JSON
      # ============================================================

      - name: Scan Image (backend) - JSON
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-api@${{ steps.backend.outputs.digest }}
          format: json
          output: trivy-backend.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report (backend) - JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: trivy-backend.json
          retention-days: 30

      # ============================================================
      # Trivy - Worker - SARIF
      # ============================================================

      - name: Scan Image (worker) - SARIF
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-worker@${{ steps.worker.outputs.digest }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report (worker) - SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-worker.sarif
          category: trivy-worker

      # ============================================================
      # Trivy - Worker - JSON
      # ============================================================

      - name: Scan Image (worker) - JSON
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-worker@${{ steps.worker.outputs.digest }}
          format: json
          output: trivy-worker.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report (worker) - JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-worker-report
          path: trivy-worker.json
          retention-days: 30

      # ============================================================
      # Trivy - Admin-UI - SARIF
      # ============================================================

      - name: Scan Image (admin-ui) - SARIF
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-admin-ui@${{ steps.admin_ui.outputs.digest }}
          format: sarif
          output: trivy-admin-ui.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report (admin-ui) - SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-admin-ui.sarif
          category: trivy-admin-ui

      # ============================================================
      # Trivy - Admin-UI - JSON
      # ============================================================

      - name: Scan Image (admin-ui) - JSON
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-admin-ui@${{ steps.admin_ui.outputs.digest }}
          format: json
          output: trivy-admin-ui.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report (admin-ui) - JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-admin-ui-report
          path: trivy-admin-ui.json
          retention-days: 30

      # ============================================================
      # Trivy - User-UI - SARIF
      # ============================================================

      - name: Scan Image (user-ui) - SARIF
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-user-ui@${{ steps.user_ui.outputs.digest }}
          format: sarif
          output: trivy-user-ui.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report (user-ui) - SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-user-ui.sarif
          category: trivy-user-ui

      # ============================================================
      # Trivy - User-UI - JSON
      # ============================================================

      - name: Scan Image (user-ui) - JSON
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-user-ui@${{ steps.user_ui.outputs.digest }}
          format: json
          output: trivy-user-ui.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report (user-ui) - JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-user-ui-report
          path: trivy-user-ui.json
          retention-days: 30
  
  deploy:
    name: Deploy Production
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64]
    # environment: production

    steps:
      - uses: actions/checkout@v5

      - name: Update Production config
        run: |
          install -D -m 644 docker-compose.prod.yml /opt/health-watch/docker-compose.prod.yml
          install -D -m 644 nginx/nginx.conf /opt/health-watch/nginx/nginx.conf
      
      - name: Deploy Images
        run: |
          cd /opt/health-watch
          IMAGE_TAG="$GITHUB_SHA" docker compose --env-file .env.prod -f docker-compose.prod.yml config -q
          IMAGE_TAG="$GITHUB_SHA" docker compose --env-file .env.prod -f docker-compose.prod.yml up -d --pull always

