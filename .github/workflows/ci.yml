name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches-ignore:
      - "RMgulane-patch-*"

        # workflow_dispatch:
        #   inputs:
        #     job:
        #       description: "Job to run"
        #       required: true
        #       type: choice
        #       options:
        #         - backend
        #         - worker
        #         - admin-ui
        #         - user-ui
        #         - docker-build

permissions:
  contents: read
  security-events: write

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: docker.io/jgripe455679

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew clean test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall messaging
      - run: python -m compileall utils
      - run: python -m py_compile messaging/*.py
      - run: python -m py_compile utils/*.py

  admin-ui:
    # if: |
    #   (github.event_name == 'push' && github.actor != 'RMgulane') ||
    #   (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'RMgulane')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run build

  user-ui:
    # if: |
    #   (github.event_name == 'push' && github.actor != 'RMgulane') ||
    #   (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'RMgulane')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22.19.0"
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, worker, admin-ui, user-ui]

    outputs:
      backend-digest: ${{ steps.backend.outputs.digest }}
      worker-digest: ${{ steps.worker.outputs.digest }}
      admin-digest: ${{ steps.admin_ui.outputs.digest }}
      user-digest: ${{ steps.user_ui.outputs.digest }}
    
    steps:
      - uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        run: |
          docker buildx build \
          --push \
          --tag "${IMAGE_PREFIX}/health-watch-api:${GITHUB_SHA}" \
          --metadata-file backend-metadata.json \
          ./backend

          digest=$(jq -r '."containerimage.digest"' backend-metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      
      - name: Build and push worker
        id: worker
        run: |
          docker buildx build \
          --push \
          --tag "${IMAGE_PREFIX}/health-watch-worker:${GITHUB_SHA}" \
          --metadata-file worker-metadata.json \
          ./scripts

          digest=$(jq -r '."containerimage.digest"' worker-metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Build and push admin UI
        id: admin_ui
        run: |
          docker buildx build \
          --push \
          --tag "${IMAGE_PREFIX}/health-watch-admin-ui:${GITHUB_SHA}" \
          --metadata-file admin-ui-metadata.json \
          ./frontend

          digest=$(jq -r '."containerimage.digest"' admin-ui-metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Build and push user UI
        id: user_ui
        run: |
          docker buildx build \
          --push \
          --tag "${IMAGE_PREFIX}/health-watch-user-ui:${GITHUB_SHA}" \
          --metadata-file user-ui-metadata.json \
          ./frontend-user

          digest=$(jq -r '."containerimage.digest"' user-ui-metadata.json)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      
      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-api@${{ steps.backend.outputs.digest }}
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      
      - name: Upload Trivy reports (backend)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
      
      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-worker@${{ steps.worker.outputs.digest }}
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      
      - name: Upload Trivy reports (worker)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-worker.sarif
      
      - name: Scan admin UI image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-admin-ui@${{ steps.admin_ui.outputs.digest }}
          format: sarif
          output: trivy-admin-ui.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy reports (admin-ui)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-admin-ui.sarif

      - name: Scan user UI image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/health-watch-user-ui@${{ steps.user_ui.outputs.digest }}
          format: sarif
          output: trivy-user-ui.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      
      - name: Upload Trivy reports (user-ui)
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-user-ui.sarif
      


