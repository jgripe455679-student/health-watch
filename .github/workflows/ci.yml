name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches-ignore:
      - 'RMgulane-patch-*'


  # workflow_dispatch:
  #   inputs:
  #     job:
  #       description: "Job to run"
  #       required: true
  #       type: choice
  #       options:
  #         - backend
  #         - worker
  #         - admin-ui
  #         - user-ui
  #         - docker-build

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew clean test
      
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall messaging
      - run: python -m compileall utils
      - run: python -m py_compile messaging/*.py
      - run: python -m py_compile utils/*.py

    
  admin-ui:
    # if: |
    #   (github.event_name == 'push' && github.actor != 'RMgulane') ||
    #   (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'RMgulane')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  user-ui:
    # if: |
    #   (github.event_name == 'push' && github.actor != 'RMgulane') ||
    #   (github.event_name == 'pull_request' && github.event.pull_request.user.login != 'RMgulane')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
  
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, worker, admin-ui, user-ui]

    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run:  docker build --tag health-watch-api:test ./backend

      # - name: Verify Trivy vulnerabilities
      #   uses: aquasecurity/trivy-action@0.35.0
      #   with:
      #     image-ref: health-watch-api:test
      #     format: table
      #     severity: CRITICAL,HIGH
      #     ignore-unfixed: false
      #     exit-code: "0"
      
      - name: Build worker image
        run:  docker build --tag health-watch-worker:test ./scripts

      - name: Build admin UI image
        run: docker build --tag health-watch-admin-ui:test ./frontend

      - name: Build user UI image
        run: docker build --tag health-watch-user-ui:test ./frontend-user
      
      - name: Scan worker image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: health-watch-worker:test
          format: json
          output: trivy-worker.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"
      
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-worker-report
          path: trivy-worker.json
      
      - name: Scan worker image for GitHub Code Scanning
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: health-watch-worker:test
          format: sarif
          output: trivy-worker.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-worker.sarif

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: health-watch-api:test
          format: json
          output: trivy-backend.json
          severity: CRITICAL,HIGH,MEDIUM,LOW
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-backend-report
          path: trivy-backend.json
      
      - name: Scan backend image for GitHub Code Scanning
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: health-watch-api:test
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload SARIF report
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
      
