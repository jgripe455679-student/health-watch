name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - run: chmod +x gradlew
      - run: ./gradlew clean test

  admin-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  user-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-user

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-user/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
  
  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, admin-ui, user-ui]

    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run:  docker build --tag health-watch-api:test ./backend
      
      - name: Build worker image
        run:  docker build --tag health-watch-worker:test ./scripts

      - name: Build admin UI image
        run: docker build --tag health-watch-admin-ui:test ./frontend

      - name: Build user UI image
        run: docker build --tag health-watch-user-ui:test ./frontend-user
