services:
  redis:
    image: redis:6.0-alpine
    container_name: redis_${ENVIRONMENT}
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # ports:
    #     - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:4.0.5-management
    container_name: rabbitmq_${ENVIRONMENT}
    # ports:
    #     - "5672:5672"
    #     - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    volumes:
      - ./rabbitmq_config:/etc/rabbitmq
      - ./rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq_log:/var/log/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  worker:
    build:
      context: ./scripts/
      dockerfile: Dockerfile
    container_name: worker_${ENVIRONMENT}
    environment:
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    depends_on:
      rabbitmq:
        condition: service_healthy

  api:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    container_name: api_${ENVIRONMENT}
    # ports:
    #   - "8080:8080"
      # - "5005:5005"
    # extra_hosts:
    #     - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_APP_USER}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_APP_PASSWORD}
      - RABBITMQ_HOST=${RABBITMQ_HOST}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_USERNAME=${REDIS_USERNAME}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SYSADMIN_USERNAME=${SYSADMIN_USERNAME}
      - SYSADMIN_PASSWORD=${SYSADMIN_PASSWORD}
      - SYSUSER_USERNAME=${SYSUSER_USERNAME}
      - SYSUSER_PASSWORD=${SYSUSER_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    networks:
      - default
      - database_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  database:
    image: mysql:8.0.41-debian
    container_name: database_${ENVIRONMENT}
    # ports:
    #     - "3306:3306"
    environment:
      - MYSQL_ROOT_USER=${MYSQL_ROOT_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_APP_USER}
      - MYSQL_PASSWORD=${MYSQL_APP_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - database_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u ${MYSQL_APP_USER} -p${MYSQL_APP_PASSWORD}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  user_ui:
    build:
      context: ./frontend-user/
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: user_ui_${ENVIRONMENT}
    # ports:
    #     - "3000:80"
    depends_on:
      - api

  admin_ui:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    container_name: admin_ui_${ENVIRONMENT}
    # ports:
    #     - "3001:80"
    depends_on:
      - api

  proxy:
    image: nginx:stable-alpine
    container_name: proxy_${ENVIRONMENT}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - user_ui
      - admin_ui
      - api

volumes:
  redis_data:
    driver: local
  rabbitmq_config:
  rabbitmq_data:
  rabbitmq_log:
  mysql_data:

networks:
  database_network:
    internal: true

