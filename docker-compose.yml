services:
    rabbitmq:
        image: rabbitmq:4.0.5-management
        container_name: rabbitmq_${ENVIRONMENT}
        ports:
            - "5672:5672"
            - "15672:15672"
        environment:
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
        volumes:
            - ./rabbitmq_config:/etc/rabbitmq
            - ./rabbitmq_data:/var/lib/rabbitmq
            - ./rabbitmq_log:/var/log/rabbitmq
    worker:
        build:
            context: ./scripts/
            dockerfile: Dockerfile
        container_name: worker_${ENVIRONMENT}
        environment:
            - RABBITMQ_HOST=${RABBITMQ_HOST}
            - RABBITMQ_PORT=${RABBITMQ_PORT}
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
        depends_on:
            - rabbitmq
    
    api:
        build:
            context: ./backend/
            dockerfile: Dockerfile
        container_name: api_${ENVIRONMENT}
        ports:
            - "8080:8080"
            # - "5005:5005"
        # extra_hosts:
        #     - "host.docker.internal:host-gateway"
        environment:
            - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
            - SPRING_DATASOURCE_USERNAME=${MYSQL_ROOT_USER}
            - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - RABBITMQ_HOST=${RABBITMQ_HOST}
            - RABBITMQ_PORT=${RABBITMQ_PORT}
            - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
            - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
            - MYSQL_HOST=${MYSQL_HOST}
            - MYSQL_PORT=${MYSQL_PORT}
        depends_on:
            - database
            - rabbitmq
    
    database:
        image: mysql:8.0.41-debian
        container_name: database_${ENVIRONMENT}
        ports:
            - "3306:3306"
        environment:
            - MYSQL_ROOT_USER=${MYSQL_ROOT_USER}
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
            - MYSQL_DATABASE=${MYSQL_DATABASE}
        volumes:
            - ./mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 10s
            timeout: 5s
            retries: 5
    
    user_ui:
        build:
            context: ./frontend-user/
            dockerfile: Dockerfile
        container_name: user_id_${ENVIRONMENT}
        ports:
            - "3000:80"
        depends_on:
            - api
    
    admin_ui:
        build:
            context: ./frontend/
            dockerfile: Dockerfile
        container_name: admin_ui_${ENVIRONMENT}
        ports:
            - "3001:80"
        depends_on:
            - api


volumes:
    rabbitmq_config:
    rabbitmq_data:
    rabbitmq_log:
    mysql_data:

