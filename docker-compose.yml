services:
  backend:
    build:
      context: ./backend/
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file: dev.env
    networks:
      - springboot-mysql-network
  db:
    image: mysql:8.0.36
    ports:
      - "3306:3306"
    env_file: dev.env
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - springboot-mysql-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 30s
      retries: 10

volumes:
  mysql-data:
networks:
  springboot-mysql-network:
    name: springboot-mysql-network